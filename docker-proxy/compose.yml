name: docker-proxy

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - LOGS=1
      - EVENTS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - VERSION=1
      - POST=0        # Disabilita creazione/avvio di nuovi container via API grezze
      - EXEC=0        # Impedisce l'esecuzione di comandi exec all'interno dei container
      - BUILD=0
      - AUTH=0
      - SECRETS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true