name: nextcloud

services:
  nextcloud-db:
    image: mariadb:10.11
    container_name: nextcloud_db
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    volumes:
      - nextcloud_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud-redis:
    image: redis:alpine
    container_name: nextcloud_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    environment:
      - MYSQL_HOST=nextcloud_db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=nextcloud_redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      # Domini e IP fidati
      - NEXTCLOUD_TRUSTED_DOMAINS_1=localhost
      - NEXTCLOUD_TRUSTED_DOMAINS_2=192.168.178.40
      - NEXTCLOUD_TRUSTED_DOMAINS_3=cloud.DOMAIN_PLACEHOLDER.com
      - NEXTCLOUD_TRUSTED_DOMAINS_4=nextcloud.DOMAIN_PLACEHOLDER.com
      - NEXTCLOUD_TRUSTED_DOMAINS_5=home-server.local
      - NEXTCLOUD_TRUSTED_DOMAINS_6=cloud.home-server.local
      # Ottimizzazioni PHP per file grandi e performance
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_LIMIT=10G
      # Proxy e SSL
      - NC_overwriteprotocol=https
      - NC_overwritecondaddr=^.*$
      - TRUSTED_PROXIES=0.0.0.0/0
      - NC_maintenance_window_start=2
    volumes:
      # Codice e configurazione di Nextcloud
      - nextcloud_html:/var/www/html
      # File e documenti salvati sull'SSD esterno
      - /mnt/ssd/nextclouddata:/var/www/html/data
    networks:
      - default
      - proxy-network

volumes:
  nextcloud_db_data:
  nextcloud_html:

networks:
  proxy-network:
    external: true