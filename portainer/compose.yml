name: portainer

services:
  portainer:
    image: portainer/portainer-ee:lts
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORTAINER_LICENSE_KEY=LICENSE_KEY_PLACEHOLDER # free license key for Portainer Business Edition https://www.portainer.io/take-3
    networks:
      - proxy-network

volumes:
  portainer_data:

networks:
  proxy-network:
    name: proxy-network
    external: true
