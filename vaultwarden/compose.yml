name: vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - SIGNUPS_ALLOWED=false
      - WEBSOCKET_ENABLED=true
      - TZ=Europe/Rome
    volumes:
      - ./vw-data:/data
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true